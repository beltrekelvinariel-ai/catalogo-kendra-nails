<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A303E" />
      <stop offset="100%" stop-color="#24171E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D89C" />
      <stop offset="50%" stop-color="#C9A45C" />
      <stop offset="100%" stop-color="#9C7732" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="#E8B7C7" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6" />
  <!-- Crown -->
  <path d="M42 34 L45 28 L50 32 L55 28 L58 34 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="26" r="1.5" fill="#FFF7F9" />
  <!-- Letter K -->
  <text x="50" y="65" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="700" fill="url(#goldGrad)">K</text>
  <!-- Sparkles -->
  <text x="50" y="78" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#E8B7C7" letter-spacing="2">NAILS</text>
  <circle cx="28" cy="40" r="1" fill="#F2D89C" />
  <circle cx="72" cy="40" r="1" fill="#F2D89C" />
</svg>
