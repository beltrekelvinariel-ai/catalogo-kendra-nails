<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="460" height="140" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C788" />
      <stop offset="50%" stop-color="#C9A45C" />
      <stop offset="100%" stop-color="#9C7732" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#E8B7C7" />
      <stop offset="100%" stop-color="#A66B83" />
    </linearGradient>
    <linearGradient id="plumGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E3342" />
      <stop offset="100%" stop-color="#35252D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crown Icon over K -->
  <g transform="translate(75, 12) scale(0.75)" fill="url(#goldGrad)">
    <path d="M5 25 L12 10 L20 18 L28 6 L36 18 L44 10 L51 25 Z" />
    <circle cx="12" cy="8" r="2.2" fill="#E5C788" />
    <circle cx="28" cy="4" r="2.5" fill="#FFF7F9" />
    <circle cx="44" cy="8" r="2.2" fill="#E5C788" />
    <circle cx="28" cy="20" r="1.8" fill="#FFFDF9" />
  </g>

  <!-- Butterfly Accent -->
  <g transform="translate(355, 14) scale(0.65)" stroke="url(#goldGrad)" stroke-width="1.8" fill="none">
    <!-- Top Wings -->
    <path d="M25 35 C15 15, -5 10, 0 35 C5 45, 15 45, 25 38 Z" fill="url(#roseGrad)" fill-opacity="0.3" />
    <path d="M25 35 C35 15, 55 10, 50 35 C45 45, 35 45, 25 38 Z" fill="url(#roseGrad)" fill-opacity="0.3" />
    <!-- Bottom Wings -->
    <path d="M25 38 C18 45, 8 50, 12 60 C18 68, 24 55, 25 45 Z" fill="url(#roseGrad)" fill-opacity="0.25" />
    <path d="M25 38 C32 45, 42 50, 38 60 C32 68, 26 55, 25 45 Z" fill="url(#roseGrad)" fill-opacity="0.25" />
    <!-- Body & Antennae -->
    <line x1="25" y1="28" x2="25" y2="52" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M25 28 Q18 20, 15 22" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" />
    <path d="M25 28 Q32 20, 35 22" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" />
  </g>

  <!-- Main Brand Name: KENDRA -->
  <text x="60" y="75" font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', 'Didot', serif" font-size="44" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">
    KENDRA
  </text>

  <!-- Script Secondary: NAILS with Heart Flourish -->
  <text x="285" y="74" font-family="'Brush Script MT', 'Dancing Script', 'Alex Brush', cursive" font-size="42" font-style="italic" font-weight="400" fill="url(#roseGrad)">
    Nails
  </text>
  
  <!-- Mini Heart Accent -->
  <path transform="translate(378, 62) scale(0.65)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#E8B7C7" />

  <!-- Elegant Divider Lines with Center Diamond -->
  <line x1="45" y1="95" x2="200" y2="95" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
  <polygon points="230,90 235,95 230,100 225,95" fill="url(#goldGrad)" />
  <circle cx="215" cy="95" r="1.5" fill="#E8B7C7" />
  <circle cx="245" cy="95" r="1.5" fill="#E8B7C7" />
  <line x1="260" y1="95" x2="415" y2="95" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />

  <!-- Slogan: UÑAS QUE HABLAN DE TI -->
  <text x="230" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="11.5" font-weight="500" letter-spacing="5" fill="#E8B7C7">
    ✦ UÑAS QUE HABLAN DE TI ✦
  </text>
</svg>
